services:
  # 1. Blackbox Exporter (Privado)
  - type: pserv
    name: blackbox-exporter
    env: docker
    dockerfilePath: Dockerfile.blackbox
    plan: free

  # 2. Prometheus (Privado)
  - type: pserv
    name: prometheus
    env: docker
    dockerfilePath: Dockerfile.prometheus
    plan: free

  # 3. Grafana (Público)
  - type: web
    name: grafana-externo
    env: image
    image:
      url: grafana/grafana:latest
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: "true"
      - key: GF_AUTH_ANONYMOUS_ORG_ROLE
        value: "Viewer"
      - key: GF_SECURITY_ALLOW_EMBEDDING
        value: "true"