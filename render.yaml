services:
  - type: web
    name: monitor-horus-stack
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: "true"
      - key: GF_AUTH_ANONYMOUS_ORG_ROLE
        value: "Viewer"
      - key: GF_SECURITY_ALLOW_EMBEDDING
        value: "true"